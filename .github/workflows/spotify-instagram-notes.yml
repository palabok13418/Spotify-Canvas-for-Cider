name: Spotify Instagram Notes Plugin Build

on:
  push:
    branches:
      - main
    paths:
      - "spotify-instagram-notes/**"
      - ".github/workflows/spotify-instagram-notes.yml"
  pull_request:
    branches:
      - main
    paths:
      - "spotify-instagram-notes/**"
      - ".github/workflows/spotify-instagram-notes.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spotify-instagram-notes-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-plugin:
    name: Install, type-check, build, and package Cider plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: spotify-instagram-notes

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.10.0"

      - name: Install plugin dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check and build plugin
        run: pnpm build

      - name: Package installable Cider plugin
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/plugin.js
          test -s dist/plugin.yml
          rm -f Spotify-Notes-Bridge.zip
          (
            cd dist
            zip -r ../Spotify-Notes-Bridge.zip .
          )
          unzip -l Spotify-Notes-Bridge.zip

      - name: Upload prepared plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: spotify-notes-bridge-plugin
          path: spotify-instagram-notes/Spotify-Notes-Bridge.zip
          if-no-files-found: error
          retention-days: 30
